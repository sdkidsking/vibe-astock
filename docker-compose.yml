# 腾讯云轻量 / 任意 Linux + Docker 的单服务编排。
# 凭据从同目录 .env 读取（docker compose 自动加载，不进 git）：
#   MIMO_API_KEY=...                 # 必填，复盘 LLM（config.py 优先读环境变量，无需挂 mimo.env）
#   MIMO_BASE_URL=...                # 选填，默认 https://token-plan-cn.xiaomimimo.com/v1
#   MIMO_MODEL=...                   # 选填，deep 档模型名，默认 mimo-v2.5-pro
#   VR_API_KEY=...                   # 选填，启用后 VR 分栏路由要求 Bearer 认证（公网建议设）
services:
  vibe:
    build:
      context: .
      args:
        # 依赖安装源：默认腾讯云 pypi 镜像（服务器内网直达）；海外构建可在 .env 里覆盖
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
    image: vibe-astock:latest
    container_name: vibe-astock
    ports:
      # 只绑宿主回环：公网唯一入口是 nginx 反代（https://7uffy.top/astock/），
      # 8910 不需要也不应该在轻量防火墙上放行
      - "127.0.0.1:8910:8910"
    environment:
      - MIMO_API_KEY=${MIMO_API_KEY:?请在 .env 里配置 MIMO_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-v2.5-pro}
      - VR_API_KEY=${VR_API_KEY:-}
      # 挂在域名下时写操作（POST/DELETE）的 origin 白名单（server.py 的 _ALLOWED_HOSTS）
      - VIBE_ALLOW_HOSTS=7uffy.top
      - TZ=Asia/Shanghai
    volumes:
      - vibe-data:/data      # 复盘产物/归档/账本/vr 持仓（HOME=/data，代码里 ~ 全指到这）
    restart: unless-stopped
    healthcheck:
      # slim 镜像没有 curl/wget，用 python 探活；VR 并入失败时 /api/health 404 会如实反映
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8910/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  vibe-data:
